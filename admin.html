<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06090c"><title>MS Barbearia — Agenda</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head>
<body>
<header class="admin-head"><div><span>MS BARBEARIA</span><h1>AGENDA</h1></div><a href="index.html">Ver site ↗</a></header>
<main>
  <section class="today"><p class="eyebrow">QUEM ESTÁ MARCADO HOJE?</p><h2 id="todayTitle"></h2><div id="nextClient" class="next-client"></div><div id="appointmentList" class="appointment-list"></div></section>
  <section class="quick-actions"><button class="primary" id="newBooking">+ NOVO AGENDAMENTO</button><button id="blockTime">BLOQUEAR HORÁRIO</button><button id="otherDay">VER OUTRO DIA</button></section>
  <section class="day-panel" id="dayPanel"><div class="panel-title"><div><span>OUTRO DIA</span><h2>ESCOLHA UMA DATA</h2></div><input type="date" id="datePicker"></div><div id="dayState"></div><button class="day-block" id="toggleDay">BLOQUEAR DIA INTEIRO</button><div id="slotList" class="slot-list"></div></section>
</main>
<div class="sheet" id="sheet" aria-hidden="true"><div class="sheet-card"><button class="sheet-close" id="sheetClose">×</button><span>BLOQUEAR HORÁRIO</span><h2 id="sheetDate"></h2><div id="sheetTimes" class="sheet-times"></div></div></div>
<script src="admin.js"></script></body></html>
